name: Publish scheduled posts

# Two slots a day: the pillar at 08:30 Asia/Seoul, the supporting piece at
# 17:30. In UTC that is 23:32 the previous day, and 08:32 the same day.
#
# GitHub's scheduler is best-effort and queues heavily on round minutes — the
# first real run of this workflow was scheduled for 23:30 UTC and executed at
# 01:25 UTC, nearly two hours late. So: odd minutes to dodge the contention,
# and several attempts per slot rather than one. The script is idempotent and
# publishes only its own slot, so whichever attempt lands first does the work
# and the rest are no-ops.
#
# How late is "late" here, measured rather than assumed: on 2026-09-02 the
# four morning attempts were delivered 1h40m, 1h53m, 4h14m and 4h21m behind
# their crons, and the afternoon ones had still not arrived four hours after
# the last of them was due. A slot whose attempts are packed into 75 minutes
# does not survive that, so each slot now runs a tail of later attempts.
#
# The slot comes from WHICH CRON FIRED, never from the wall clock. GitHub
# delivers these hours late and a clock-based rule read a delayed morning run
# landing at 14:10 KST as "it is afternoon, serve pm" and released the
# afternoon post three hours early. The cron expression is the only thing
# that still says what the run was meant to do.
on:
  schedule:
    - cron: '32 23 * * *'   # 08:32 KST — morning slot
    - cron: '53 23 * * *'   # 08:53 KST
    - cron: '21 0 * * *'    # 09:21 KST
    - cron: '47 0 * * *'    # 09:47 KST
    - cron: '17 1 * * *'    # 10:17 KST — morning tail, for a delayed queue
    - cron: '43 2 * * *'    # 11:43 KST — last morning attempt
    # The afternoon crons are requested EARLY on purpose. GitHub delivers
    # this repo's 08:00-11:00 UTC crons about four hours late, every day, so
    # a request at 03:07 UTC is what actually lands near 17:00 KST. If the
    # queue is healthy instead and one arrives on time at 12:07 KST, the
    # window guard below rejects it and a later attempt does the work — an
    # early request cannot cause an early post.
    - cron: '7 3 * * *'     # 12:07 KST requested — lands ~16:00 at +4h
    - cron: '13 4 * * *'    # 13:13 KST requested — lands ~17:15 at +4h
    - cron: '32 8 * * *'    # 17:32 KST — afternoon slot, for an on-time queue
    - cron: '53 8 * * *'    # 17:53 KST
    - cron: '21 9 * * *'    # 18:21 KST
    - cron: '47 9 * * *'    # 18:47 KST
    - cron: '17 10 * * *'   # 19:17 KST
    - cron: '43 11 * * *'   # 20:43 KST — last on-time attempt
  workflow_dispatch:
    inputs:
      slot:
        description: 'Which slot to publish (am or pm)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Decide which slot this run serves
        id: slot
        run: |
          schedule='${{ github.event.schedule }}'
          manual='${{ github.event.inputs.slot }}'
          if [ -n "$manual" ]; then
            # A person asking for a slot by hand has a reason. No window check.
            echo "slot=$manual" >> "$GITHUB_OUTPUT"
            echo "Serving the $manual slot from manual dispatch, at $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            exit 0
          fi
          if [ -z "$schedule" ]; then
            echo "::error::no slot input and no schedule — refusing to guess"
            exit 1
          fi
          # Second field of the cron is the UTC hour: 23, 0, 1 and 2 are the
          # morning slot; 3, 4 and 8 through 11 the afternoon one.
          case "$(echo "$schedule" | awk '{print $2}')" in
            23|0|1|2)          slot=am; lo=6;  hi=14 ;;
            3|4|8|9|10|11)     slot=pm; lo=15; hi=23 ;;
            *)          echo "::error::unrecognised schedule '$schedule'"; exit 1 ;;
          esac
          # A delay of a few hours is survivable — a post going out at 20:00
          # instead of 17:30 is merely a late post. A delay that crosses
          # midnight KST is not: "today" has moved on, and the run would
          # release tomorrow's post in the small hours. So each slot has a
          # window in Korean local time, and a run landing outside its own
          # window publishes nothing and leaves the work to the next attempt.
          # This reads the clock to REFUSE work, never to choose which work.
          hour=$(TZ=Asia/Seoul date +%-H)
          if [ "$hour" -lt "$lo" ] || [ "$hour" -gt "$hi" ]; then
            echo "::warning::$slot run from cron '$schedule' landed at ${hour}:00 KST, outside its ${lo}:00-${hi}:59 window — skipping"
            echo "slot=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "Serving the $slot slot from cron '$schedule', at $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"

      - name: Publish any draft whose date has arrived
        id: flip
        if: steps.slot.outputs.slot != ''
        run: |
          node scripts/publish-due-drafts.mjs --slot=${{ steps.slot.outputs.slot }} | tee out.txt
          echo "count=$(grep -oP '::count::\K\d+' out.txt)" >> "$GITHUB_OUTPUT"
          rm out.txt

      - name: Install dependencies
        if: steps.flip.outputs.count != '' && steps.flip.outputs.count != '0'
        run: npm ci

      # Never push something that would not build. A red site is worse than a
      # post that goes out a day late.
      - name: Verify
        if: steps.flip.outputs.count != '' && steps.flip.outputs.count != '0'
        run: |
          npm run lint:seo
          npm run lint:data
          npm run build

      - name: Commit and push
        if: steps.flip.outputs.count != '' && steps.flip.outputs.count != '0'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/posts
          git commit -m "post: publish ${{ steps.slot.outputs.slot }} guide(s) for $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
