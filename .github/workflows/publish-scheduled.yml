name: Publish scheduled posts

# One post a day, at 07:00 Asia/Seoul. That is the time a post may first
# appear, enforced by the window guard below — the crons are only attempts
# at hitting it.
#
# It was two a day until 2026-09-12. The reason for halving it is not that
# twice a day harmed anything: crawl budget on a young domain follows the
# domain's age and authority, not how fast it publishes. It is that sixty
# guides were sitting discovered-but-uncrawled, and there is nothing to gain
# from adding to a queue Google is not draining — while one a day doubles how
# long the written backlog lasts. Going back to two is this comment, the pm
# crons, and the pm branch of the slot case.
#
# GitHub's scheduler is best-effort and queues heavily. Measured on this
# repo, an attempt is delivered between one and five hours after its cron,
# and the 08:00-11:00 UTC block is reliably at the bad end:
#
#   2026-09-02 pm   08:32->12:56  08:53->12:59  09:21->13:43
#                   09:47->13:52  10:17->14:29  11:43->15:17   (~4h, all six)
#   2026-09-03 am   23:32->01:17  23:53->01:53  00:21->04:36
#                   00:47->05:09  01:17->05:53  02:43->07:23   (1h45 -> 4h40)
#
# So each slot requests EARLY and repeatedly, starting about three hours
# before its target. An attempt that arrives on time lands before the slot
# opens and the window guard refuses it; an attempt delayed by hours lands
# inside the window and does the work. Requesting early therefore cannot
# produce an early post — it can only rescue a late queue. Checked across
# delays of zero to seven hours: every case has an attempt landing in
# window for both slots.
#
# The slot comes from WHICH CRON FIRED, never from the wall clock. GitHub
# delivers these hours late and a clock-based rule read a delayed morning
# run landing at 14:10 KST as "it is afternoon, serve pm" and released the
# afternoon post three hours early. The cron expression is the only thing
# that still says what the run was meant to do. The clock is consulted only
# to REFUSE work that has arrived too late to belong to its slot.

on:
  schedule:
    # Target 07:00 KST. UTC hours 20-23 and 0-1.
    - cron: '11 20 * * *'   # 05:11 KST requested — rescues a 2h+ delay
    - cron: '23 21 * * *'   # 06:23 KST requested — rescues a 1h+ delay
    - cron: '7 22 * * *'    # 07:07 KST — the on-time attempt
    - cron: '41 22 * * *'   # 07:41 KST
    - cron: '32 23 * * *'   # 08:32 KST
    - cron: '21 0 * * *'    # 09:21 KST
    - cron: '17 1 * * *'    # 10:17 KST — last attempt of the day
  workflow_dispatch:
    inputs:
      slot:
        description: 'Which slot to publish (am; pm only if one is ever scheduled again)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Decide which slot this run serves
        id: slot
        run: |
          schedule='${{ github.event.schedule }}'
          manual='${{ github.event.inputs.slot }}'
          if [ -n "$manual" ]; then
            # A person asking for a slot by hand has a reason. No window check.
            echo "slot=$manual" >> "$GITHUB_OUTPUT"
            echo "Serving the $manual slot from manual dispatch, at $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            exit 0
          fi
          if [ -z "$schedule" ]; then
            echo "::error::no slot input and no schedule — refusing to guess"
            exit 1
          fi
          # Second field of the cron is the UTC hour. Only the morning block
          # is scheduled; anything else means the crons and this case have
          # drifted apart, which is worth failing on rather than guessing.
          case "$(echo "$schedule" | awk '{print $2}')" in
            20|21|22|23|0|1)   slot=am; lo=7;  hi=14 ;;
            *)          echo "::error::unrecognised schedule '$schedule'"; exit 1 ;;
          esac
          # A delay of a few hours is survivable — a post going out at 20:00
          # instead of 15:00 is merely a late post. A delay that crosses
          # midnight KST is not: "today" has moved on, and the run would
          # release tomorrow's post in the small hours. So each slot has a
          # window in Korean local time, and a run landing outside its own
          # window publishes nothing and leaves the work to the next attempt.
          # This reads the clock to REFUSE work, never to choose which work.
          hour=$(TZ=Asia/Seoul date +%-H)
          if [ "$hour" -lt "$lo" ] || [ "$hour" -gt "$hi" ]; then
            echo "::warning::$slot run from cron '$schedule' landed at ${hour}:00 KST, outside its ${lo}:00-${hi}:59 window — skipping"
            echo "slot=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "Serving the $slot slot from cron '$schedule', at $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"

      - name: Publish any draft whose date has arrived
        id: flip
        if: steps.slot.outputs.slot != ''
        run: |
          node scripts/publish-due-drafts.mjs --slot=${{ steps.slot.outputs.slot }} | tee out.txt
          echo "count=$(grep -oP '::count::\K\d+' out.txt)" >> "$GITHUB_OUTPUT"
          rm out.txt

      - name: Install dependencies
        if: steps.flip.outputs.count != '' && steps.flip.outputs.count != '0'
        run: npm ci

      # Never push something that would not build. A red site is worse than a
      # post that goes out a day late.
      - name: Verify
        if: steps.flip.outputs.count != '' && steps.flip.outputs.count != '0'
        run: |
          npm run lint:seo
          npm run lint:data
          npm run build

      - name: Commit and push
        if: steps.flip.outputs.count != '' && steps.flip.outputs.count != '0'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/posts
          git commit -m "post: publish ${{ steps.slot.outputs.slot }} guide(s) for $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
