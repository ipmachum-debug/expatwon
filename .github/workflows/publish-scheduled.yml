name: Publish scheduled posts

# Two slots a day: the pillar at 08:30 Asia/Seoul, the supporting piece at
# 17:30. In UTC that is 23:32 the previous day, and 08:32 the same day.
#
# GitHub's scheduler is best-effort and queues heavily on round minutes — the
# first real run of this workflow was scheduled for 23:30 UTC and executed at
# 01:25 UTC, nearly two hours late. So: odd minutes to dodge the contention,
# and several attempts per slot rather than one. The script is idempotent and
# publishes only its own slot, so whichever attempt lands first does the work
# and the rest are no-ops.
#
# The slot comes from WHICH CRON FIRED, never from the wall clock. GitHub
# delivers these hours late — on 2026-09-01 the morning attempts arrived
# between 10:56 and 14:43 KST — and a clock-based rule read a delayed
# morning run landing at 14:10 as "it is afternoon, serve pm" and released
# the afternoon post three hours early. The cron expression is the only
# thing that still says what the run was meant to do.
on:
  schedule:
    - cron: '32 23 * * *'   # 08:32 KST — morning slot
    - cron: '53 23 * * *'   # 08:53 KST
    - cron: '21 0 * * *'    # 09:21 KST
    - cron: '47 0 * * *'    # 09:47 KST — last morning attempt
    - cron: '32 8 * * *'    # 17:32 KST — afternoon slot
    - cron: '53 8 * * *'    # 17:53 KST
    - cron: '21 9 * * *'    # 18:21 KST
    - cron: '47 9 * * *'    # 18:47 KST — last afternoon attempt
  workflow_dispatch:
    inputs:
      slot:
        description: 'Which slot to publish (am or pm)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Before noon KST is the morning slot, after it the afternoon one.
      - name: Decide which slot this run serves
        id: slot
        run: |
          schedule='${{ github.event.schedule }}'
          manual='${{ github.event.inputs.slot }}'
          if [ -n "$manual" ]; then
            slot="$manual"
            why="manual dispatch"
          elif [ -n "$schedule" ]; then
            # Second field of the cron is the UTC hour: 23 and 0 are the
            # morning slot, 8 and 9 the afternoon one.
            case "$(echo "$schedule" | awk '{print $2}')" in
              23|0) slot=am ;;
              8|9)  slot=pm ;;
              *)    echo "::error::unrecognised schedule '$schedule'"; exit 1 ;;
            esac
            why="cron '$schedule'"
          else
            echo "::error::no slot input and no schedule — refusing to guess"
            exit 1
          fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "Serving the $slot slot from $why, at $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"

      - name: Publish any draft whose date has arrived
        id: flip
        run: |
          node scripts/publish-due-drafts.mjs --slot=${{ steps.slot.outputs.slot }} | tee out.txt
          echo "count=$(grep -oP '::count::\K\d+' out.txt)" >> "$GITHUB_OUTPUT"
          rm out.txt

      - name: Install dependencies
        if: steps.flip.outputs.count != '0'
        run: npm ci

      # Never push something that would not build. A red site is worse than a
      # post that goes out a day late.
      - name: Verify
        if: steps.flip.outputs.count != '0'
        run: |
          npm run lint:seo
          npm run lint:data
          npm run build

      - name: Commit and push
        if: steps.flip.outputs.count != '0'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/posts
          git commit -m "post: publish ${{ steps.slot.outputs.slot }} guide(s) for $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
