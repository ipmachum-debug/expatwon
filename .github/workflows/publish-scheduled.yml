name: Publish scheduled posts

# Target is 08:30 Asia/Seoul = 23:32 UTC the previous day.
#
# GitHub's scheduler is best-effort and queues heavily on round minutes — the
# first real run of this workflow was scheduled for 23:30 UTC and executed at
# 01:25 UTC, nearly two hours late. So: odd minutes to dodge the contention,
# and four attempts rather than one. The script is idempotent (it publishes
# only what is due and exits in seconds otherwise), so whichever attempt lands
# first does the work and the rest are no-ops.
on:
  schedule:
    - cron: '32 23 * * *'   # 08:32 KST — the intended slot
    - cron: '53 23 * * *'   # 08:53 KST
    - cron: '21 0 * * *'    # 09:21 KST
    - cron: '47 0 * * *'    # 09:47 KST — last resort
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Publish any draft whose date has arrived
        id: flip
        run: |
          node scripts/publish-due-drafts.mjs | tee out.txt
          echo "count=$(grep -oP '::count::\K\d+' out.txt)" >> "$GITHUB_OUTPUT"
          rm out.txt

      - name: Install dependencies
        if: steps.flip.outputs.count != '0'
        run: npm ci

      # Never push something that would not build. A red site is worse than a
      # post that goes out a day late.
      - name: Verify
        if: steps.flip.outputs.count != '0'
        run: |
          npm run lint:seo
          npm run build

      - name: Commit and push
        if: steps.flip.outputs.count != '0'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/posts
          git commit -m "post: publish scheduled guide(s) for $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
